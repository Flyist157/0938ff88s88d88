<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800">
  <defs>
    <linearGradient id="metallic-base" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b3a6f"/>
      <stop offset="0.4" stop-color="#1478c6"/>
      <stop offset="0.75" stop-color="#62c7f4"/>
      <stop offset="1" stop-color="#cbe9f8"/>
    </linearGradient>
    <radialGradient id="metallic-glow" cx="0.3" cy="0.2" r="0.9">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="0.4" stop-color="#9fd6f5" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#0b3a6f" stop-opacity="0"/>
    </radialGradient>
    <filter id="metallic-noise" x="-10%" y="-10%" width="120%" height="120%">
